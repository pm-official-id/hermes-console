version: '3.8'

services:
  locai-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: locai-console
    ports:
      - "5001:5000"
    volumes:
      # Mount host Docker socket so LocAI Console can discover and control host services
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DOCKER_HOST=unix:///var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5000/api/healthz').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
